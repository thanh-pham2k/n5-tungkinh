<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Live Preview & Quiz</title>
  <link rel="stylesheet" href="css/markdown-lesson.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@17.0.0/lib/marked.umd.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.1/dist/purify.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.min.js" defer></script>
  <script src="js/lesson-parser.js" defer></script>
  <script src="js/markdown-lesson.js" defer></script>
</head>
<body>
  <header class="preview-toolbar">
    <strong>Markdown Live Preview</strong>
    <button id="lesson-open" type="button">Open</button>
    <input id="lesson-file" type="file" accept=".md,.markdown,.txt,text/plain,text/markdown" hidden>
    <button id="lesson-copy" type="button">Copy</button>
    <button id="lesson-pdf" type="button">Export PDF</button>
    <button id="lesson-reset" type="button">Reset</button>
    <button id="lesson-example" type="button">Bài mẫu</button>
    <label><input id="lesson-sync" type="checkbox" checked> Sync scroll</label>
    <label><input id="lesson-dark" type="checkbox"> Dark mode</label>
    <span id="lesson-status" role="status"></span>
  </header>
  <main class="preview-workspace">
    <section class="source-pane" aria-label="Markdown editor">
      <div class="pane-heading">MARKDOWN</div>
      <textarea id="lesson-source" spellcheck="false" aria-label="Nội dung Markdown" placeholder="Dán Markdown tại đây…"></textarea>
    </section>
    <div id="preview-divider" role="separator" aria-label="Độ rộng editor" aria-orientation="vertical" aria-valuemin="15" aria-valuemax="85" aria-valuenow="50" tabindex="0"></div>
    <section class="preview-pane" aria-label="Live preview">
      <div class="pane-heading">PREVIEW</div>
      <div id="lesson-preview-scroll"><article id="lesson-output" aria-label="Bài học"></article></div>
    </section>
  </main>
</body>
</html>
