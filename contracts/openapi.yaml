      "post": {
        "operationId": "parseAndSaveStudyContent",
        "description": "Intentional public shared imports, valid same-origin and anonymous session required. Parse and record atomic. Maximum source 1 MB UTF-8. Request UUID idempotent forever per shared library; changed payload with same key is 409. Reimport with new UUID adds a log record, reuses matching current content. Content is publicly readable.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object",
                "properties": {
                  "tool": {
                    "type": "string",
                    "enum": [
                      "instant",
                      "cards",
                      "order",
                      "typing",
                      "structures",
                      "speaking",
                      "writing",
                      "multiple-choice",
                      "markdown"
                    ]
                  },
                  "source": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 1000000
                  },
                  "language": {
                    "type": "string",
                    "enum": [
                      "en",
                      "ja"
                    ]
                  },
                  "requestId": {
                    "type": "string",
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                  }
                },
                "required": [
                  "tool",
                  "source",
                  "language",
                  "requestId"
                ],
                "additionalProperties": false
              }
            }
          }
        },
