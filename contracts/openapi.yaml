                      "type": "object",
                      "properties": {
                        "requestId": {
                          "type": "string"
                        },
                        "page": {
                          "type": "object",
                          "properties": {
                            "limit": {
                              "type": "number"
                            },
                            "nextCursor": {
                              "type": [
                                "string",
                                "null"
                              ]
                            },
                            "hasMore": {
                              "type": "boolean"
                            }
                          },
                          "required": [
