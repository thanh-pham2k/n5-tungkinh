                              "cards",
                              "order",
                              "typing",
                              "structures",
                              "speaking",
                              "writing",
                              "multiple-choice",
                              "markdown"
                            ]
                          },
                          "title": {
                            "type": "string"
                          },
                          "language": {
                            "type": "string",
                            "enum": [
                              "en",
                              "ja"
                            ]
                          },
                          "itemCount": {
                            "type": "integer",
                            "exclusiveMinimum": 0,
                            "maximum": 9007199254740991
                          },
                          "createdAt": {
                            "type": "string"
                          },
                          "lastStudiedAt": {
                            "type": "string"
                          },
                          "studyCount": {
                            "type": "integer",
                            "exclusiveMinimum": 0,
                            "maximum": 9007199254740991
                          }
