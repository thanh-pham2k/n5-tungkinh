    "/study-logs": {
      "get": {
        "operationId": "listStudyLogs",
        "description": "Public shared import history, newest first; selecting a log reads its source and parses it again. Cursor bound to tool and library.",
        "parameters": [
          {
            "name": "tool",
            "in": "query",
            "required": true,
            "schema": {
              "$schema": "https://json-schema.org/draft/2020-12/schema",
              "type": "string",
              "enum": [
                "instant",
                "cards",
                "order",
                "typing",
                "structures",
                "speaking",
                "writing",
                "multiple-choice",
                "markdown"
              ]
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 500
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
