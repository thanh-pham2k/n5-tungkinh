          {
            "name": "tool",
            "in": "query",
            "required": true,
            "schema": {
              "$schema": "https://json-schema.org/draft/2020-12/schema",
              "type": "string",
              "enum": [
                "instant",
                "cards",
                "order",
                "typing",
                "structures",
                "speaking",
                "writing",
                "multiple-choice",
                "markdown"
              ]
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
