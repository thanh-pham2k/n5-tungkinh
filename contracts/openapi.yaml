                        },
                        "tool": {
                          "type": "string",
                          "enum": [
                            "instant",
                            "cards",
                            "order",
                            "typing",
                            "structures",
                            "speaking",
                            "writing",
                            "multiple-choice",
                            "markdown"
                          ]
                        },
                        "title": {
                          "type": "string"
                        },
                        "language": {
                          "type": "string",
                          "enum": [
                            "en",
                            "ja"
                          ]
                        },
                        "itemCount": {
                          "type": "integer",
